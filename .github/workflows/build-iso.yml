name: Build CarBerry OS Live ISO

on:
  push:
    branches: [ main, develop ]
    paths:
      - '.github/workflows/build-iso.yml'
      - 'iso-config/**'
  workflow_dispatch:

concurrency:
  group: iso-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Verify free disk space
        shell: bash
        run: |
          df -h /
          free -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update APT and install live-build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            syslinux-utils \
            isolinux \
            xorriso \
            squashfs-tools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            dosfstools \
            mtools \
            parted \
            file \
            wget \
            ca-certificates

      - name: Check live-build version
        shell: bash
        run: |
          lb --version
          debootstrap --version

      - name: Prepare live-build configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p carberry-iso
          cd carberry-iso

          lb config \
            --mode debian \
            --distribution bookworm \
            --architecture amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --mirror-binary-security "http://deb.debian.org/debian-security/" \
            --debootstrap-options "--variant=minbase --arch=amd64" \
            --apt-recommends false \
            --bootappend-live "boot=live components locales=en_US.UTF-8 keyboard-layouts=us" \
            --iso-volume "CarBerry OS" \
            --iso-publisher "CarBerry Project" \
            --image-name "carberry-os-bookworm"

          mkdir -p config/package-lists

          cat > config/package-lists/system.list.chroot <<'EOF'
# Базовые утилиты
sudo
curl
wget
git
nano
vim
htop
neofetch

# Локализация и шрифты
locales
fonts-liberation
fonts-dejavu
ttf-dejavu
keyboard-configuration
console-cyrillic

# Сетевые утилиты
openssh-client
dnsutils
iputils-ping
traceroute
EOF

          cat > config/package-lists/kde.list.chroot <<'EOF'
# KDE Plasma Desktop
kde-plasma-desktop
konsole
dolphin
kwrite
kcalc
okular
vlc

# Звук и мультимедиа
pulseaudio
pavucontrol
alsa-utils
EOF

          cat > config/package-lists/apps.list.chroot <<'EOF'
# Installer
calamares
calamares-settings-debian

# Браузер
firefox-esr
firefox-esr-l10n-en-us

# Дополнительные утилиты
gparted
kate
xdg-user-dirs
EOF

          cat > config/package-lists/bootloader.list.chroot <<'EOF'
# GRUB и boot utilities
grub-pc
grub-efi-amd64
grub-efi-ia32
isolinux
syslinux-utils
syslinux
EOF

          cat > config/package-lists/hardware.list.chroot <<'EOF'
# Firmware
firmware-linux
firmware-linux-nonfree
wireless-tools
wpasupplicant
network-manager
network-manager-gnome

# Видео- и аудиодрайверры
xserver-xorg-video-nouveau
xserver-xorg-video-intel
xserver-xorg-video-amd
xserver-xorg-input-libinput
EOF

          cat > config/package-lists/kernel.list.chroot <<'EOF'
linux-image-amd64
EOF

          mkdir -p config/hooks/live
          cat > config/hooks/live/0100-timezone.chroot <<'EOF'
#!/bin/bash
set -e

ln -sf /usr/share/zoneinfo/UTC /etc/localtime

echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
echo "ru_RU.UTF-8 UTF-8" >> /etc/locale.gen
locale-gen
EOF
          chmod +x config/hooks/live/0100-timezone.chroot

          echo "=== Checking configuration ==="
          ls -la config/package-lists/
          echo "=== Configuration created ==="

      - name: Build Live ISO
        working-directory: carberry-iso
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting live-build process..."
          echo "Disk space before build:"
          df -h /

          sudo -E lb build 2>&1 | tee build.log

          echo "Disk space after build:"
          df -h /

      - name: Verify ISO creation
        working-directory: carberry-iso
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Looking for ISO files ==="
          find . -name "*.iso" -ls 2>/dev/null || echo "No ISO found yet"

          echo "=== Checking build directory structure ==="
          ls -lah

          echo "=== Checking binary directory ==="
          if [ -d "binary" ]; then
            ls -lah binary/
          fi

      - name: Validate built ISO
        working-directory: carberry-iso
        shell: bash
        run: |
          set -euo pipefail

          ISO_FILE=$(find . -type f -name "*.iso" -print -quit)

          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: ISO file not found!"
            ls -lah
            tail -100 build.log || true
            exit 1
          fi

          echo "Found ISO: $ISO_FILE"
          file "$ISO_FILE"
          isoinfo -d -i "$ISO_FILE" | head -20 || true

      - name: Prepare artifacts
        working-directory: carberry-iso
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ../artifacts
          ISO_FILE=$(find . -type f -name "*.iso" -print -quit)

          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: ISO file not found!"
            exit 1
          fi

          cp "$ISO_FILE" ../artifacts/
          ls -lh ../artifacts/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: carberry-os-iso
          path: artifacts/*.iso
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.iso
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup and final report
        if: always()
        working-directory: carberry-iso
        shell: bash
        run: |
          echo "=== Build Summary ==="
          echo "Final disk usage:"
          df -h /

          if [ -f build.log ]; then
            echo "=== Last 50 lines of build.log ==="
            tail -50 build.log
          fi

          echo "=== Final artifacts ==="
          ls -lh ../artifacts/ || echo "No artifacts found"
