name: Build CarBerry OS (Debian)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Debian live-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap

      - name: Configure Debian Live
        run: |
          mkdir -p debian-live
          cd debian-live
          # Настраиваем сборку Debian с графической оболочкой KDE
          lb config \
            --debian-installer live \
            --archive-areas "main contrib non-free non-free-firmware" \
            --desktop kde \
            --architectures amd64

      - name: Build ISO
        run: |
          cd debian-live
          sudo lb build

      - name: Upload CarBerry OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: CarBerry-OS-Debian-ISO
          path: debian-live/*.iso
