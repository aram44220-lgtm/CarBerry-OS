name: Build CarBerry OS (Debian)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Debian live-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools

      - name: Configure Debian Live ISO
        run: |
          mkdir -p debian-live
          cd debian-live
          
          # Настройка базовой конфигурации Debian Bookworm
          lb config \
            --distribution bookworm \
            --debian-installer live \
            --archive-areas "main contrib non-free non-free-firmware" \
            --architectures amd64
          
          # Прописываем графическую среду KDE Plasma и необходимые утилиты
          mkdir -p config/package-lists
          cat << 'EOF' > config/package-lists/desktop.list.chroot
          task-kde-desktop
          plasma-desktop
          sddm
          network-manager
          sudo
          EOF

      - name: Build ISO
        run: |
          cd debian-live
          sudo lb build

      - name: Upload CarBerry OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: CarBerry-OS-Debian-ISO
          path: debian-live/*.iso
