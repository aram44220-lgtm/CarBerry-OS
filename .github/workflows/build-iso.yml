name: Build CarBerry OS (Debian)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap syslinux-utils isolinux xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin

      - name: Configure Debian Live ISO
        run: |
          mkdir -p debian-live
          cd debian-live
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --debian-installer live
          
          mkdir -p config/package-lists
          echo "task-kde-desktop calamares firefox-esr" > config/package-lists/desktop.list.chroot

      - name: Build ISO
        run: |
          cd debian-live
          sudo lb build

      - name: Upload CarBerry OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: CarBerry-OS-Debian-ISO
          path: debian-live/*.iso
