name: Build CarBerry OS (Ubuntu)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools ubuntu-keyring

      - name: Configure Ubuntu Live ISO
        run: |
          mkdir -p ubuntu-live
          cd ubuntu-live
          
          # Настраиваем сборку на базе Ubuntu Noble (24.04 LTS)
          lb config \
            --distribution noble \
            --architectures amd64 \
            --archive-areas "main restricted universe multiverse" \
            --mirror-bootstrap "http://archive.ubuntu.com/ubuntu/" \
            --mirror-chroot "http://archive.ubuntu.com/ubuntu/" \
            --mirror-binary "http://archive.ubuntu.com/ubuntu/" \
            --security true

          # Добавляем KDE Plasma и базовый софт
          mkdir -p config/package-lists
          cat << 'EOF' > config/package-lists/desktop.list.chroot
          kubuntu-desktop
          sddm
          network-manager
          calamares
          firefox
          vlc
          sudo
          EOF

      - name: Build ISO
        run: |
          cd ubuntu-live
          sudo lb build

      - name: Upload CarBerry OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: CarBerry-OS-Ubuntu-ISO
          path: ubuntu-live/*.iso
