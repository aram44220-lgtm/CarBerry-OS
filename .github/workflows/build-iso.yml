name: Build CarBerry OS Live ISO

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/build-iso.yml'
      - 'iso-config/**'
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install live-build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin syslinux-utils isolinux \
            dosfstools mtools parted file wget ca-certificates

      - name: Create live-build config
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p carberry-iso
          cd carberry-iso

          lb config \
            --mode debian \
            --distribution bookworm \
            --architecture amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "https://deb.debian.org/debian/" \
            --mirror-chroot "https://deb.debian.org/debian/" \
            --mirror-binary "https://deb.debian.org/debian/" \
            --mirror-binary-security "https://security.debian.org/debian-security/" \
            --apt-recommends false \
            --bootappend-live "boot=live components locales=en_US.UTF-8 keyboard-layouts=us" \
            --iso-volume "CarBerry OS" \
            --iso-publisher "CarBerry Project" \
            --image-name "carberry-os-bookworm"

          mkdir -p config/package-lists
          cat > config/package-lists/base.list.chroot <<'EOF'
          linux-image-amd64
          sudo
          curl
          wget
          git
          nano
          vim
          htop
          neofetch
          locales
          openssh-client
          network-manager
          wireless-tools
          firefox-esr
          firefox-esr-l10n-en-us
          calamares
          calamares-settings-debian
          kde-plasma-desktop
          konsole
          dolphin
          vlc
          firmware-linux
          grub-pc
          grub-efi-amd64
          EOF

      - name: Build ISO
        working-directory: carberry-iso
        shell: bash
        run: |
          set -euxo pipefail
          sudo -E lb build 2>&1 | tee build.log

      - name: Check result
        working-directory: carberry-iso
        shell: bash
        run: |
          set -euxo pipefail
          find . -name "*.iso" -ls
